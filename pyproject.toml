[project]
name = "marketing-radar"
version = "0.1.0"
description = "Budget Trend Radar — marketing sub-agent library for the AI in Business hackathon dashboard"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-firestore>=2.19,<3",
    "google-auth>=2.35,<3",
    "google-genai>=1.0,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "apscheduler>=3.10,<4",
    "platformdirs>=4.2,<5",
    "pytrends>=4.9,<5",
    "python-dotenv>=1.0,<2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]
# Voice AI receptionist (plans/voice-receptionist/vr_plan.md). Kept separate so the marketing
# agent's install is unchanged. requirements.txt mirrors this for Vercel. No torch (§3).
voice = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
    "twilio>=9.3,<10",
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "pyyaml>=6.0,<7",
    "onnxruntime>=1.18,<2",
    "groq>=0.11,<1",
    "elevenlabs>=1.50,<3",
    "websockets>=12,<15",
    "google-api-python-client>=2.140,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["marketing_radar", "services", "contracts", "config", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]
