[project]
name = "marketing-radar"
version = "0.1.0"
description = "Budget Trend Radar — marketing sub-agent library for the AI in Business hackathon dashboard"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-firestore>=2.19,<3",
    "google-auth>=2.35,<3",
    "google-genai>=1.0,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "apscheduler>=3.10,<4",
    "platformdirs>=4.2,<5",
    "pytrends>=4.9,<5",
    "python-dotenv>=1.0,<2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["marketing_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]
